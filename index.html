<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>Крестики-нолики</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="app">
    <h1>Крестики-нолики</h1>

    <div class="mode-select">
      <label>
        <input type="radio" name="mode" value="pvp" checked>
        Два игрока
      </label>
      <label>
        <input type="radio" name="mode" value="pve">
        Против бота
      </label>
    </div>

    <div class="names">
      <label class="name-field">
        <span>Игрок X:</span>
        <input type="text" id="name-x" maxlength="16" placeholder="Игрок X">
      </label>
      <label class="name-field" id="name-o-field">
        <span>Игрок O:</span>
        <input type="text" id="name-o" maxlength="16" placeholder="Игрок O">
      </label>
    </div>

    <div class="difficulty-select hidden" id="difficulty-select">
      <label>
        <input type="radio" name="difficulty" value="easy">
        Лёгкий
      </label>
      <label>
        <input type="radio" name="difficulty" value="medium">
        Средний
      </label>
      <label>
        <input type="radio" name="difficulty" value="hard" checked>
        Сложный
      </label>
    </div>

    <div class="first-select hidden" id="first-select">
      <label>
        <input type="radio" name="first" value="human" checked>
        Я начинаю
      </label>
      <label>
        <input type="radio" name="first" value="bot">
        Бот начинает
      </label>
    </div>

    <div class="series-select">
      <label>
        <input type="radio" name="series" value="single" checked>
        Обычная игра
      </label>
      <label>
        <input type="radio" name="series" value="bo3">
        До 3 побед
      </label>
    </div>

    <div class="series-score hidden" id="series-score">
      Серия: <b id="series-x">0</b> : <b id="series-o">0</b> (до 3)
    </div>

    <p id="status">Ход: X</p>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="score">
      <span><b id="score-x-name">Игрок X</b>: <b id="score-x">0</b></span>
      <span><b id="score-o-name">Игрок O</b>: <b id="score-o">0</b></span>
      <span>Ничьи: <b id="score-draw">0</b></span>
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-label">Всего партий</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Побед X</div>
        <div class="stat-value" id="stat-x">0%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Побед O</div>
        <div class="stat-value" id="stat-o">0%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Ничьих</div>
        <div class="stat-value" id="stat-draw">0%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Средняя партия</div>
        <div class="stat-value" id="stat-avg">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Быстрейшая победа</div>
        <div class="stat-value" id="stat-fastest">—</div>
      </div>
    </div>

    <div class="buttons">
      <button id="restart">Начать заново</button>
      <button id="reset-score" class="secondary">Сбросить счёт</button>
    </div>

    <div class="buttons">
      <button id="sound-toggle" class="secondary">🔊 Звук: вкл</button>
      <button id="theme-toggle" class="secondary">🌙 Тема: тёмная</button>
    </div>

    <section class="history-section">
      <div class="history-header">
        <h2>История партий</h2>
        <button id="clear-history" class="secondary small">Очистить</button>
      </div>

      <div class="history-controls">
        <label class="history-filter">
          <span>Фильтр:</span>
          <select id="history-filter">
            <option value="all">Все</option>
            <option value="pvp">Два игрока</option>
            <option value="pve">Против бота</option>
            <option value="bo3">Серии</option>
          </select>
        </label>
        <span id="history-counter" class="history-counter">0 из 0</span>
      </div>

      <ul id="history-list" class="history-list">
        <li class="history-empty">Пока нет сыгранных партий</li>
      </ul>

      <button id="history-more" class="secondary small hidden">Показать ещё</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
